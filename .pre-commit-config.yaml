repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: Check formatting
        entry: bunx --no-install oxfmt --check
        language: system
        types: [text]

      - id: oxlint
        name: Lint JavaScript and TypeScript
        entry: bunx --no-install oxlint
        language: system
        files: '\.[cm]?[jt]sx?$'
